<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --concreto: #cfcac2;
        --tinta: #16130f;
        --cicatriz: #ff8c00;
        --rachadura: #e60000;
        --dano: #00a0e6;
        --display: "Archivo Black", sans-serif;
        --corpo: "Inter", sans-serif;
        --mono: "JetBrains Mono", monospace;
        --ruido: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.09 0 0 0 0 0.08 0 0 0 0 0.06 0 0 0 0.55 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--concreto); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--corpo); color: var(--tinta); }

      /* chão de concreto: cor chapada + ruído fino estático */
      .concreto { position: absolute; inset: 0; background-color: var(--concreto); }
      .concreto::after { content: ""; position: absolute; inset: 0; background-image: var(--ruido); opacity: 0.06; }

      .display { font-family: var(--display); font-weight: 400; letter-spacing: -0.01em; line-height: 1.02; }
      .linha { font-family: var(--corpo); font-weight: 700; font-size: 44px; line-height: 1.2; }
      .w { display: inline-block; }

      /* etiqueta no estilo da saída do detector */
      .etiqueta { position: absolute; color: #fff; font-family: var(--corpo); font-weight: 700; white-space: nowrap; }
    </style>
  </head>
